<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Postmaker</title>

    <!-- Bootstrap (CDN) -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      crossorigin="anonymous"
    />

    <!-- App styles -->
    <link rel="stylesheet" href="style/style.css" />
    <link rel="stylesheet" href="style/layouts/side-by-side.css" />
    <link rel="stylesheet" href="style/layouts/one-pair.css" />
    <link rel="stylesheet" href="style/layouts/stack.css" />
  </head>
  <body>
    <div class="container-fluid py-4">
      <div class="row g-4">
        <!-- ------------------------------------------------------ -->
        <!-- INPUT panel                                            -->
        <!-- ------------------------------------------------------ -->
        <div class="col-lg-4">
          <h1 class="h4 mb-3">Postmaker</h1>
          <form id="postForm">
            <!-- Layout -->
            <div class="mb-3">
              <label class="form-label d-block">Layout</label>
              <div class="form-check">
                <input class="form-check-input" type="radio" name="layout" id="layoutSideBySide" value="sideBySide" checked />
                <label class="form-check-label" for="layoutSideBySide">Side by side</label>
              </div>
              <div class="form-check">
                <input class="form-check-input" type="radio" name="layout" id="layoutOnePair" value="onePair" />
                <label class="form-check-label" for="layoutOnePair">One pair at a page</label>
              </div>
              <div class="form-check">
                <input class="form-check-input" type="radio" name="layout" id="layoutStack" value="stack" />
                <label class="form-check-label" for="layoutStack">Stack</label>
              </div>
            </div>

            <hr />

            <!-- Global text size -->
            <div class="mb-3">
              <label for="allSizeInput" class="form-label">All Text Size (px)</label>
              <div class="input-group">
                <input
                  type="number"
                  class="form-control"
                  id="allSizeInput"
                  min="8"
                  max="200"
                  value="36"
                />
                <button type="button" class="btn btn-outline-secondary" id="allSizeBtn">
                  Apply to all
                </button>
              </div>
              <div class="form-text">Sets every text element to this size; you can still tweak each below.</div>
            </div>

            <hr />

            <!-- Hindi -->
            <details class="lang-section mb-3" open>
              <summary class="lang-summary">Hindi</summary>
              <div class="form-check mb-2 mt-2">
                <input class="form-check-input" type="checkbox" id="hindiEnabled" checked />
                <label class="form-check-label" for="hindiEnabled">Show Hindi in image</label>
              </div>
              <div class="mb-3">
                <label for="hindiFontSelect" class="form-label">Hindi Font</label>
                <select class="form-select" id="hindiFontSelect"></select>
              </div>
              <!-- text boxes + per-element formatting (generated by app.js) -->
              <div id="hindiInputs"></div>
            </details>

            <!-- Urdu -->
            <details class="lang-section mb-3" open>
              <summary class="lang-summary">Urdu</summary>
              <div class="form-check mb-2 mt-2">
                <input class="form-check-input" type="checkbox" id="urduEnabled" checked />
                <label class="form-check-label" for="urduEnabled">Show Urdu in image</label>
              </div>
              <div class="mb-3">
                <label for="urduFontSelect" class="form-label">Urdu Font</label>
                <select class="form-select" id="urduFontSelect"></select>
              </div>
              <div class="form-check mb-3">
                <input class="form-check-input" type="checkbox" id="kasheedaInput" />
                <label class="form-check-label" for="kasheedaInput">
                  Add Kasheeda (elongate Urdu)
                </label>
              </div>
              <!-- text boxes + per-element formatting (generated by app.js) -->
              <div id="urduInputs"></div>
            </details>

            <hr />

            <!-- Page -->
            <div class="mb-3">
              <label for="topMarginInput" class="form-label">Top Margin (px)</label>
              <input
                type="number"
                class="form-control"
                id="topMarginInput"
                min="0"
                max="1250"
                value="100"
              />
            </div>

            <div class="mb-3">
              <label for="bgImageInput" class="form-label">Background Image</label>
              <div class="input-group">
                <input
                  type="file"
                  class="form-control"
                  id="bgImageInput"
                  accept="image/*"
                />
                <button type="button" class="btn btn-outline-secondary" id="bgClearBtn">
                  Clear
                </button>
              </div>
            </div>

            <div class="mb-3">
              <label for="bgModeInput" class="form-label">Background Display Mode</label>
              <select class="form-select" id="bgModeInput">
                <option value="fill">Fill (cover, may crop)</option>
                <option value="fit">Fit / Contain (whole image, may leave space)</option>
                <option value="stretch">Stretch (fill exactly, may distort)</option>
                <option value="shrink">Shrink to Fit (only scale down)</option>
                <option value="scaleDown">Scale Down (original size, else fit)</option>
                <option value="center">Center (no resize)</option>
                <option value="tile">Tile (repeat)</option>
              </select>
            </div>

            <!-- Theme -->
            <div class="mb-3">
              <label class="form-label d-block">Theme</label>
              <div class="form-check form-check-inline">
                <input
                  class="form-check-input"
                  type="radio"
                  name="theme"
                  id="themeDark"
                  value="dark"
                  checked
                />
                <label class="form-check-label" for="themeDark">Dark</label>
              </div>
              <div class="form-check form-check-inline">
                <input
                  class="form-check-input"
                  type="radio"
                  name="theme"
                  id="themeLight"
                  value="light"
                />
                <label class="form-check-label" for="themeLight">Light</label>
              </div>
            </div>

            <button type="submit" class="btn btn-primary w-100" id="generateBtn">
              Generate Image
            </button>
          </form>
        </div>

        <!-- ------------------------------------------------------ -->
        <!-- OUTPUT panel                                           -->
        <!-- ------------------------------------------------------ -->
        <div class="col-lg-8">
          <!-- Live layout that gets captured (built by the selected layout). -->
          <h2 class="h6 text-muted">Layout</h2>

          <!-- Shown when the body text won't fit at the chosen font size -->
          <div id="bodyWarning" class="alert alert-warning d-none" role="alert"></div>

          <!-- Page navigation (multi-page layouts) -->
          <div id="pageNav" class="align-items-center gap-2 mb-2">
            <button id="prevPageBtn" class="btn btn-outline-secondary btn-sm" type="button">
              ‹ Prev
            </button>
            <span id="pageIndicator" class="text-muted small"></span>
            <button id="nextPageBtn" class="btn btn-outline-secondary btn-sm" type="button">
              Next ›
            </button>
          </div>

          <!-- Debug aid: outline every box in the preview. Never captured. -->
          <div class="form-check mb-1">
            <input class="form-check-input" type="checkbox" id="debugBordersInput" />
            <label class="form-check-label" for="debugBordersInput">
              Show element outlines
              <span class="text-muted small">(preview only — not in the generated image)</span>
            </label>
          </div>
          <div id="debugLegend" class="debug-legend d-none">
            <span class="dbg-table">table</span>
            <span class="dbg-row">tr</span>
            <span class="dbg-cell">td</span>
            <span class="dbg-div">div</span>
            <span class="dbg-span">span</span>
            <span class="dbg-img">img</span>
          </div>

          <div class="frame-wrapper mb-4">
            <div class="mainFrame theme-dark layout-sideBySide" id="mainFrame"></div>
          </div>

          <!-- Generated PNG(s) -->
          <div id="resultArea" class="d-none">
            <div class="d-flex align-items-center justify-content-between mb-2">
              <h2 class="h6 text-muted mb-0">Generated Images (1080 × 1350)</h2>
              <button id="downloadAllBtn" class="btn btn-success btn-sm" type="button">
                Download all
              </button>
            </div>
            <div id="resultImages"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- html2canvas (CDN) — renders the layout to a PNG -->
    <script
      src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"
      crossorigin="anonymous"
    ></script>

    <!-- App scripts -->
    <script src="js/logos.js"></script>
    <script src="js/fonts.js"></script>
    <script src="js/layouts/side-by-side.js"></script>
    <script src="js/layouts/one-pair.js"></script>
    <script src="js/layouts/stack.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
